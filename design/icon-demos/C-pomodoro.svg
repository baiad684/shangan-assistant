<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="方案C 番茄钟">
  <defs>
    <linearGradient id="c-ring" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#14C98A"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#FBF7EE"/>

  <!-- 发条钮 -->
  <rect x="233" y="18" width="46" height="44" rx="13" fill="#065F46"/>

  <!-- 外环 -->
  <circle cx="256" cy="272" r="214" fill="none" stroke="url(#c-ring)" stroke-width="38"/>

  <!-- 表盘 -->
  <circle cx="256" cy="272" r="180" fill="#FDFAF2"/>

  <!-- 四点刻度 -->
  <g fill="#0A5C44" opacity="0.85">
    <circle cx="256" cy="124" r="11"/>
    <circle cx="404" cy="272" r="11"/>
    <circle cx="256" cy="420" r="11"/>
    <circle cx="108" cy="272" r="11"/>
  </g>

  <!-- 指针 -->
  <path d="M256 272 L174 224" stroke="#07402F" stroke-width="26" stroke-linecap="round"/>
  <path d="M256 272 L331 142" stroke="#07402F" stroke-width="22" stroke-linecap="round"/>

  <!-- 中心轴 -->
  <circle cx="256" cy="272" r="24" fill="#F97316"/>
